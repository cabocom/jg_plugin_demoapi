stages:
  - lint
  - test
  - build

variables:
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"
  PYTHONUNBUFFERED: "1"

default:
  image: python:3.12-slim
  cache:
    key: "python-pip-${CI_COMMIT_REF_SLUG}"
    paths:
      - .cache/pip

# ==========================================
# STAGE: LINT
# ==========================================
lint:ruff:
  stage: lint
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never
    - if: $CI_COMMIT_BRANCH
    - if: $CI_COMMIT_TAG
  before_script:
    - python -m pip install --upgrade pip
    - pip install ruff
  script:
    - echo "🔍 Ejecutando análisis estático con Ruff en jg_plugin_demoapi..."
    - ruff check .
    - echo "🎨 Verificando formato de código..."
    - ruff format --check .

# ==========================================
# STAGE: TEST
# ==========================================
test:pytest:
  stage: test
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never
    - if: $CI_COMMIT_BRANCH
    - if: $CI_COMMIT_TAG
  before_script:
    - python -m pip install --upgrade pip
    - pip install -e .[dev]
  script:
    - echo "🧪 Ejecutando suite de tests unitarios de jg_plugin_demoapi..."
    - pytest tests/

# ==========================================
# STAGE: BUILD
# ==========================================
build:package:
  stage: build
  rules:
    - if: $CI_COMMIT_TAG
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  before_script:
    - python -m pip install --upgrade pip
    - pip install build
  script:
    - echo "📦 Compilando paquete Python limpio (sdist y wheel)..."
    - python -m build
  artifacts:
    name: "dist-$CI_COMMIT_REF_SLUG"
    paths:
      - dist/
    expire_in: 1 week

build:docker:
  stage: build
  image: docker:24.0.7
  services:
    - name: docker:24.0.7-dind
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      when: never
    - if: $CI_COMMIT_BRANCH
    - if: $CI_COMMIT_TAG
  before_script:
    - REGISTRY_HOST="${CI_REGISTRY:-registry.gitlab.com}"
    - REGISTRY_USER="${CI_REGISTRY_USER:-gitlab-ci-token}"
    - REGISTRY_PASS="${CI_REGISTRY_PASSWORD:-$CI_JOB_TOKEN}"
    - echo "🔑 Iniciando sesión en GitLab Container Registry ($REGISTRY_HOST)..."
    - echo "$REGISTRY_PASS" | docker login "$REGISTRY_HOST" -u "$REGISTRY_USER" --password-stdin
    - apk add --no-cache python3 py3-pip git
    - python3 -m venv /tmp/sdk_env
    - /tmp/sdk_env/bin/pip install --upgrade pip
    - /tmp/sdk_env/bin/pip install "git+https://gitlab-ci-token:${CI_JOB_TOKEN}@gitlab.com/javiergalvez-ia/jg_agente_sdk.git@main" || /tmp/sdk_env/bin/pip install "jg-agente-sdk>=1.0.0"
  script:
    - export PATH="/tmp/sdk_env/bin:$PATH"
    - echo "🛠️ Construyendo y publicando imagen Docker del plugin con CLI jg..."
    - jg plugin build --push
